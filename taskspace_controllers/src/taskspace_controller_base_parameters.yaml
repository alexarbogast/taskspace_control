taskspace_controller_base:
  command_interfaces: {
    type: string_array,
    description: "Names of the interfaces to command",
    validation: {
      unique<>: null,
      size_gt<>: [0],
      subset_of<>: [["position", "velocity"]],
    },
    read_only: true
  }
  state_interfaces: {
    type: string_array,
    description: "Names of the state interfaces to read",
    default_value: ["position"],
    validation: {
      unique<>: null,
      size_gt<>: [0],
      subset_of<>: [["position", "velocity"]],
    },
    read_only: true
  }
  base_link: {
    type: string,
    description: "Name of the base reference frame",
    read_only: true,
  }
  eef_link: {
    type: string,
    description: "Name of the 'tool' reference frame",
    read_only: true,
  }
  manipulability_threshold: {
    type: double,
    default_value: 0.001,
    description: "Minimum manipulability index w = sqrt(det(J*J^T)) below which output is zeroed."
  }
  enable_diagnostics: {
    type: bool,
    default_value: false,
    description: "Enable publishing of taskspace control diagnostics",
    read_only: true
  }
  joint_position_integration_mode: {
    type: string,
    default_value: "closed_loop",
    description: "Selects whether joint velocity is integrated from measured position or the previous joint reference",
    validation: {
      one_of<>: [["closed_loop", "open_loop"]],
    },
    read_only: true
  }
  open_loop_reference_error_limit: {
    type: double,
    default_value: 0.0,
    description: "Error boundary used to scale joint-reference increments in open-loop integration mode",
    read_only: true
  }
