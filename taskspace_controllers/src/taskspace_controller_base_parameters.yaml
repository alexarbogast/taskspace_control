taskspace_controller_base:
  command_interfaces: {
    type: string_array,
    description: "Names of the interfaces to command",
    validation: {
      unique<>: null,
      size_gt<>: [0],
      subset_of<>: [["position", "velocity"]],
    },
    read_only: true
  }
  state_interfaces: {
    type: string_array,
    description: "Names of the state interfaces to read",
    default_value: ["position"],
    validation: {
      unique<>: null,
      size_gt<>: [0],
      subset_of<>: [["position", "velocity"]],
    },
    read_only: true
  }
  base_link: {
    type: string,
    description: "Name of the base reference frame",
    read_only: true,
  }
  eef_link: {
    type: string,
    description: "Name of the 'tool' reference frame",
    read_only: true,
  }
  manipulability_threshold: {
    type: double,
    default_value: 0.001,
    description: "Minimum manipulability index w = sqrt(det(J*J^T)) below which output is zeroed."
  }
