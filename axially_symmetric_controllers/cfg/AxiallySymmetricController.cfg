#!/usr/bin/env python
PACKAGE = "axially_symmetric_controllers"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("k_position", double_t, 0, "The gain to scale position error", 1.0, 0.0, 100)
